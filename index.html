<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Evdeki malzemeleri gir, kolay-orta-zor modlarında ne pişirebileceğini gör.">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#EEF1F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D151E" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ne Pişsin">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<title>Bugün Ne Pişsin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..900&family=IBM+Plex+Mono:wght@400;500;600&family=Karla:ital,wght@0,400..700;1,400&display=swap">
<style>
:root{
  --ground:#F1F2EF;
  --surface:#FFFFFF;
  --surface-2:#F7F8F5;
  --ink:#1A2024;
  --ink-2:#586267;
  --ink-3:#88908F;
  --line:#DFE1DB;
  --line-soft:#EBEDE7;
  --kobalt:#1B4E9B;
  --kobalt-derin:#173F7D;
  --kobalt-soft:#E5EBF5;
  --turkuaz:#16808C;
  --turkuaz-soft:#DDEDEE;
  --yesil:#2C6E4E;
  --yesil-soft:#E0EDE5;
  --amber:#8A6206;
  --amber-soft:#F5EAD3;
  --bol:#A93B2C;
  --bol-soft:#F6E2DE;
  --uzeri:#FFFFFF;
  --golge:0 1px 2px rgba(26,32,36,.05), 0 10px 26px -14px rgba(26,32,36,.22);
  --golge-kalk:0 2px 8px rgba(26,32,36,.10), 0 28px 56px -22px rgba(26,32,36,.38);
  --display:"Gabarito","Trebuchet MS",system-ui,sans-serif;
  --body:"Karla",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121618;
    --surface:#1A2023;
    --surface-2:#212829;
    --ink:#E9EDE9;
    --ink-2:#A7B0AF;
    --ink-3:#7B8584;
    --line:#2E3639;
    --line-soft:#242B2E;
    --kobalt:#7BA9EC;
    --kobalt-derin:#1E4478;
    --kobalt-soft:#1B2A3F;
    --turkuaz:#48BDC6;
    --turkuaz-soft:#123033;
    --yesil:#63BE93;
    --yesil-soft:#152E22;
    --amber:#D6AA51;
    --amber-soft:#302713;
    --bol:#E28472;
    --bol-soft:#37201C;
    --golge:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -14px rgba(0,0,0,.7);
    --golge-kalk:0 2px 8px rgba(0,0,0,.55), 0 28px 56px -22px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#121618;
  --surface:#1A2023;
  --surface-2:#212829;
  --ink:#E9EDE9;
  --ink-2:#A7B0AF;
  --ink-3:#7B8584;
  --line:#2E3639;
  --line-soft:#242B2E;
  --kobalt:#7BA9EC;
  --kobalt-derin:#1E4478;
  --kobalt-soft:#1B2A3F;
  --turkuaz:#48BDC6;
  --turkuaz-soft:#123033;
  --yesil:#63BE93;
  --yesil-soft:#152E22;
  --amber:#D6AA51;
  --amber-soft:#302713;
  --bol:#E28472;
  --bol-soft:#37201C;
  --golge:0 1px 2px rgba(0,0,0,.45), 0 10px 26px -14px rgba(0,0,0,.7);
  --golge-kalk:0 2px 8px rgba(0,0,0,.55), 0 28px 56px -22px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--body);font-size:15.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em;font-weight:700}
button,input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--kobalt);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wrap{max-width:860px;margin:0 auto;padding:0 18px 72px}
.eyebrow{
  font-family:var(--mono);font-size:10.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px}

/* ---------- başlık ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-in{max-width:860px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:11px}
.mark{flex:none;width:32px;height:32px;display:block}
.brand{margin-right:auto;min-width:0}
.brand h1{font-size:18.5px;font-weight:800;line-height:1.15}
.icon-btn{
  flex:none;width:34px;height:34px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;
  cursor:pointer;color:var(--ink-2);
}
.icon-btn:hover{border-color:var(--kobalt);color:var(--kobalt)}

/* ---------- kiler: katlanır ---------- */
.kiler{margin-top:16px;overflow:hidden}
.kiler-bar{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:none;padding:13px 15px;cursor:pointer;
}
.kiler-bar .sepet{flex:none;width:20px;height:20px;color:var(--turkuaz)}
.kiler-bar .ozet{flex:1;min-width:0}
.kiler-bar .ozet b{display:block;font-family:var(--display);font-size:15px;font-weight:700}
.kiler-bar .ozet span{
  display:block;font-size:12.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kiler-bar .ok{
  flex:none;font-family:var(--mono);font-size:11px;color:var(--kobalt);
  background:var(--kobalt-soft);padding:5px 11px;border-radius:20px;font-weight:600;
}
.kiler[data-acik="1"] .kiler-bar{border-bottom:1px solid var(--line-soft)}
.kiler-ic{padding:15px}
.kiler-ic[hidden]{display:none}

.searchbox{position:relative}
.searchbox input{
  width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;
  background:var(--surface-2);
}
.searchbox input:focus{outline:none;border-color:var(--kobalt);background:var(--surface)}
.searchbox input::placeholder{color:var(--ink-3)}
.suggest{
  position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:20;
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  box-shadow:var(--golge-kalk);max-height:250px;overflow-y:auto;padding:4px;
}
.suggest button{
  display:flex;width:100%;align-items:center;gap:8px;text-align:left;
  background:none;border:none;padding:8px 9px;border-radius:6px;cursor:pointer;
}
.suggest button:hover,.suggest button[aria-selected="true"]{background:var(--kobalt-soft);color:var(--kobalt)}
.suggest .kat{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}

.tray{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.tray:empty{display:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--turkuaz-soft);color:var(--turkuaz);
  border-radius:20px;padding:4px 6px 4px 12px;font-size:13.5px;font-weight:700;
}
.chip button{
  background:none;border:none;cursor:pointer;color:inherit;opacity:.5;
  width:19px;height:19px;display:grid;place-items:center;border-radius:50%;padding:0;line-height:1;
}
.chip button:hover{opacity:1;background:var(--bol-soft);color:var(--bol)}

.picks{margin-top:15px;border-top:1px solid var(--line-soft);padding-top:14px}
.picks > .eyebrow{display:block;margin-bottom:10px}
.pickrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pickrow .lbl{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);width:100%;margin-bottom:2px;
}
.pick{
  background:var(--surface-2);border:1px solid var(--line);border-radius:20px;
  padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2);
  transition:border-color .12s,color .12s;
}
.pick:hover{border-color:var(--turkuaz);color:var(--turkuaz)}
.pick[data-on="1"]{background:var(--turkuaz);border-color:var(--turkuaz);color:var(--uzeri);font-weight:700}

.basics{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;padding-top:13px;border-top:1px solid var(--line-soft)}
.sw{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.sw input,.onlydo input{
  appearance:none;width:36px;height:20px;border-radius:20px;background:var(--line);
  position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s;
}
.sw input::after,.onlydo input::after{
  content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3);
}
.sw input:checked,.onlydo input:checked{background:var(--turkuaz)}
.sw input:checked::after,.onlydo input:checked::after{transform:translateX(16px)}
.kiler-ic .clear{
  background:none;border:none;cursor:pointer;padding:0;margin-top:14px;
  font-size:12.5px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px;
}
.kiler-ic .clear:hover{color:var(--bol)}
</style>
<style>
/* ---------- günün önerisi: sayfanın tek cesur hamlesi ---------- */
.hero{
  position:relative;overflow:hidden;margin-top:16px;border-radius:16px;
  background:var(--kobalt-derin);color:#fff;box-shadow:var(--golge);
  min-height:180px;display:flex;
}
.hero-in{position:relative;z-index:2;padding:20px 22px 20px;display:flex;flex-direction:column;gap:3px;flex:1}
.hero .eyebrow{color:rgba(255,255,255,.62)}
.hero h2{
  font-size:clamp(28px,7vw,40px);font-weight:800;line-height:1.05;
  margin-top:7px;letter-spacing:-.02em;color:#fff;
}
.hero-meta{
  font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.7);
  margin-top:9px;display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums;
}
.hero-durum{margin:11px 0 0;font-size:15px;color:rgba(255,255,255,.92);max-width:42ch}
.hero-durum b{color:#fff;font-weight:700}
.hero-btn{display:flex;flex-wrap:wrap;gap:9px;margin-top:auto;padding-top:18px}
.hero-btn button{
  border:none;border-radius:9px;cursor:pointer;font-weight:700;font-size:14.5px;
  padding:11px 18px;font-family:var(--display);
}
.hero-btn .birincil{background:#fff;color:var(--kobalt-derin)}
.hero-btn .birincil:hover{background:rgba(255,255,255,.88)}
.hero-btn .ikincil{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
.hero-btn .ikincil:hover{background:rgba(255,255,255,.24)}
.hero .desen{
  position:absolute;right:-46px;top:50%;transform:translateY(-50%);
  width:236px;height:236px;opacity:.12;z-index:1;pointer-events:none;
}
.hero.bos{background:var(--surface);color:var(--ink);border:1px solid var(--line);min-height:0}
.hero.bos h2{color:var(--ink);font-size:20px;margin-top:5px}
.hero.bos .eyebrow{color:var(--ink-3)}
.hero.bos .hero-durum{color:var(--ink-2)}
.hero.bos .desen{display:none}

/* ---------- zorluk modları ---------- */
.modebar{margin-top:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.modes{display:flex;gap:7px;flex-wrap:wrap}
.mode{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:8px 13px;cursor:pointer;display:flex;align-items:center;gap:9px;
  transition:border-color .12s,background .12s;
}
.mode:hover{border-color:var(--ink-3)}
.mode .nm{font-family:var(--display);font-weight:700;font-size:14.5px}
.mode .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.mode[aria-pressed="true"]{border-color:var(--kobalt);background:var(--kobalt-soft)}
.mode[aria-pressed="true"] .nm,.mode[aria-pressed="true"] .ct{color:var(--kobalt)}

/* zorluk ölçeği: dolu çubuk sayısı seviyeyi gösterir */
.meter{display:flex;align-items:flex-end;gap:2px;height:12px;flex:none}
.meter i{display:block;width:3px;background:var(--line);border-radius:1px}
.meter i:nth-child(1){height:5px}
.meter i:nth-child(2){height:8.5px}
.meter i:nth-child(3){height:12px}
.meter[data-lv="1"] i:nth-child(-n+1){background:var(--yesil)}
.meter[data-lv="2"] i:nth-child(-n+2){background:var(--amber)}
.meter[data-lv="3"] i:nth-child(-n+3){background:var(--bol)}
.hero .meter i{background:rgba(255,255,255,.3)}
.hero .meter[data-lv="1"] i:nth-child(-n+1),
.hero .meter[data-lv="2"] i:nth-child(-n+2),
.hero .meter[data-lv="3"] i:nth-child(-n+3){background:rgba(255,255,255,.9)}

.onlydo{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.tally{margin-top:15px;font-size:13.5px;color:var(--ink-2)}
.tally b{font-family:var(--mono);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- tarif listesi ---------- */
.results{margin-top:6px;display:flex;flex-direction:column;gap:7px}
.group-lbl{display:flex;align-items:center;gap:11px;margin:20px 0 3px}
.group-lbl .rule{flex:1;height:1px;background:var(--line)}

.card{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:13px 15px;transition:border-color .12s,transform .12s,box-shadow .12s;
}
.card:hover{border-color:var(--kobalt);transform:translateY(-1px);box-shadow:var(--golge)}
.card .sol{flex:1;min-width:0}
.card .ad{font-family:var(--display);font-size:16.5px;font-weight:700;line-height:1.25}
.card .satir{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .meta{
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:4px;
  display:flex;flex-wrap:wrap;gap:3px 12px;font-variant-numeric:tabular-nums;
}
.card .eksik{font-size:13px;color:var(--ink-2);margin-top:6px}
.card .eksik b{color:var(--bol);font-weight:700}
.card .sag{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* hazır tarifler kobalt bir kenarla öne çıkar; kalanlar sessiz durur */
.card.hazir{border-left:3px solid var(--kobalt);padding-left:13px}
.card.uzak{background:var(--surface-2)}
.card.uzak .ad{font-weight:600;color:var(--ink-2)}

.pill{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.ok{background:var(--yesil-soft);color:var(--yesil)}
.pill.near{background:var(--amber-soft);color:var(--amber)}
.pill.far{background:var(--bol-soft);color:var(--bol)}
.pill.tag{background:var(--turkuaz-soft);color:var(--turkuaz)}

.empty{margin-top:14px;padding:34px 22px;text-align:center;border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.empty h3{font-size:17px;margin-bottom:6px}
.empty p{margin:0;color:var(--ink-2);font-size:14px;max-width:44ch;margin-inline:auto}

/* ---------- tarif kağıdı ---------- */
.scrim{
  position:fixed;inset:0;z-index:50;background:rgba(18,22,24,.55);
  backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;
  padding:24px 16px;overflow-y:auto;
}
.scrim[hidden]{display:none!important}
.sheet{
  width:100%;max-width:620px;background:var(--surface);
  border:1px solid var(--line);border-radius:16px;box-shadow:var(--golge-kalk);overflow:hidden;
}
.sheet-hd{padding:20px 22px 16px;border-bottom:1px solid var(--line);position:relative}
.sheet-hd h2{font-size:26px;font-weight:800;padding-right:42px;line-height:1.12}
.sheet-hd .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:10px}
.sheet-meta{font-family:var(--mono);font-size:12px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:3px 12px;font-variant-numeric:tabular-nums}
.sheet-hd .close{
  position:absolute;top:16px;right:16px;width:31px;height:31px;
  border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
  cursor:pointer;color:var(--ink-2);display:grid;place-items:center;line-height:1;font-size:17px;
}
.sheet-hd .close:hover{border-color:var(--bol);color:var(--bol)}
.sheet-bd{padding:20px 22px 26px;display:flex;flex-direction:column;gap:24px}
.sheet-bd section > .eyebrow{display:block;margin-bottom:10px}

.mlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 26px}
.mlist li{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14.5px}
.mlist .mad{flex:1;min-width:0}
.mlist .ops-not{opacity:.75;font-size:12.5px}
.mlist .molcu{
  font-family:var(--mono);font-size:12.5px;color:var(--ink-2);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.mlist .yok .molcu{color:var(--bol)}
.mlist .ops .molcu{color:var(--ink-3)}
.mlist .tick{flex:none;width:17px;height:17px;display:grid;place-items:center;border-radius:50%;font-size:10px;font-weight:700;line-height:1}
.mlist .var .tick{background:var(--yesil-soft);color:var(--yesil)}
.mlist .yok .tick{background:var(--bol-soft);color:var(--bol)}
.mlist .yok{color:var(--bol);font-weight:700}
.mlist .ops .tick{background:var(--line-soft);color:var(--ink-3)}
.mlist .ops{color:var(--ink-3)}

.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:13px}
.steps li{counter-increment:s;display:grid;grid-template-columns:27px 1fr;gap:12px;align-items:start;font-size:15px}
.steps li::before{
  content:counter(s,decimal-leading-zero);
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--kobalt);
  background:var(--kobalt-soft);border-radius:7px;text-align:center;padding:4px 0;line-height:1.4;
}
.tip{
  background:var(--turkuaz-soft);border-left:3px solid var(--turkuaz);
  padding:12px 15px;border-radius:0 9px 9px 0;font-size:14.5px;
}
.tip .eyebrow{color:var(--turkuaz);display:block;margin-bottom:4px}

.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);display:flex;gap:6px;flex-wrap:wrap}
</style>
<style>
/* ---------- telefon uygulaması davranışları ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,.chip,.pill,.eyebrow,.meta{-webkit-user-select:none;user-select:none}
.steps,.mlist,.tip,.sheet-hd h2,.hero h2{-webkit-user-select:text;user-select:text}

.top-in{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));
        padding-top:calc(11px + env(safe-area-inset-top))}
.wrap{padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));
      padding-bottom:calc(72px + env(safe-area-inset-bottom))}

/* ana ekrana ekleme şeridi */
.kur{display:flex;align-items:center;gap:12px;margin-top:16px;padding:13px 15px;
     background:var(--turkuaz);color:#fff;border-radius:12px;box-shadow:var(--golge)}
.kur[hidden]{display:none!important}
.kur .yazi{flex:1;min-width:0;font-size:13.5px;line-height:1.45}
.kur .yazi b{display:block;font-family:var(--display);font-size:15px;font-weight:700;margin-bottom:1px}
.kur button{flex:none;border:none;border-radius:9px;cursor:pointer;font-weight:700;font-size:13.5px;
            padding:9px 15px;background:#fff;color:var(--turkuaz)}

{i:"firin-makarna",ad:"Fırın Makarna",zor:2,dk:55,kisi:5,kat:"Makarna",

{i:"biber-dolma",ad:"Etli Biber Dolması",zor:2,dk:75,kisi:4,kat:"Dolma",

       "Yıkanmış pirinç, salça, kıyılmış maydanoz, nane, tuz ve baharatları ekleyip 2 dakika çevir.",

{i:"sutlac",ad:"Fırın Sütlaç",zor:2,dk:70,kisi:6,kat:"Tatlı",

/* ---------------- yardımcılar ---------------- */
const TR = {"ı":"i","İ":"i","I":"i","ğ":"g","Ğ":"g","ü":"u","Ü":"u",
            "ş":"s","Ş":"s","ö":"o","Ö":"o","ç":"c","Ç":"c"};
function fold(s){
  return String(s).replace(/[ıİIğĞüÜşŞöÖçÇ]/g, c => TR[c])
                  .toLowerCase().replace(/\s+/g," ").trim();
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* Eş anlamlı malzemeleri tek bir anahtara indirger. */
const ESLESME = new Map();
for (const grup of ESLER){
  const anahtar = fold(grup[0]);
  for (const ad of grup) ESLESME.set(fold(ad), anahtar);
}
const canon = ad => ESLESME.get(fold(ad)) || fold(ad);

const ZOR_AD = {1:"Kolay", 2:"Orta", 3:"Zor"};

/* ---------------- malzeme kataloğu ---------------- */
const sayac = new Map();
for (const t of TARIFLER){
  for (const [ad] of t.mlz) sayac.set(ad, (sayac.get(ad)||0) + 1);
  for (const [ad] of (t.eks||[])) sayac.set(ad, (sayac.get(ad)||0) + 0.4);
}
for (const ad of Object.keys(KAT)) if (!sayac.has(ad)) sayac.set(ad, 0);

const KATALOG = [...sayac.keys()]
  .map(ad => ({ad, kat: KAT[ad] || "Diğer", n: sayac.get(ad)}))
  .sort((a,b) => a.ad.localeCompare(b.ad,"tr"));

const HIZLI_KATLAR = ["Sebze","Et & tavuk","Süt & kahvaltı","Kiler","Yağ & sos"];

/* ---------------- durum ---------------- */
const BASLANGIC = ["yumurta","domates","soğan","yeşil biber","patates","yoğurt",
                   "makarna","süt","tereyağı","beyaz peynir","kaşar peyniri","sarımsak",
                   "maydanoz","pirinç","limon","kıyma","domates salçası","patlıcan",
                   "havuç","bulgur","şehriye","ekmek","salatalık"];

function oku(k, varsayilan){
  try{
    const v = localStorage.getItem("bnp." + k);
    return v === null ? varsayilan : JSON.parse(v);
  }catch(e){ return varsayilan; }
}
function yaz(k, v){
  try{ localStorage.setItem("bnp." + k, JSON.stringify(v)); }catch(e){}
}

const D = {
  kiler:   oku("kiler", BASLANGIC),
  temel:   oku("temel", true),
  baharat: oku("baharat", true),
  mod:     oku("mod", "hepsi"),
  tam:     oku("tam", false),
  acik:    oku("acik", false)
};
if (!Array.isArray(D.kiler)) D.kiler = BASLANGIC.slice();

const $ = s => document.querySelector(s);
const el = {
  ara:$("#ara"), oneri:$("#oneri"), tepsi:$("#tepsi"), hizli:$("#hizli"),
  sayi:$("#kilerSayi"), temizle:$("#temizle"), modlar:$("#modlar"),
  ozet:$("#ozet"), liste:$("#liste"), perde:$("#perde"), kagit:$("#kagit"),
  swTemel:$("#swTemel"), swBaharat:$("#swBaharat"), swTam:$("#swTam"),
  dbSayi:$("#dbSayi"), temaBtn:$("#temaBtn"), hero:$("#hero"),
  kiler:$("#kiler"), kilerAc:$("#kilerAc"), kilerIc:$("#kilerIc"),
  kilerOrnek:$("#kilerOrnek"), kilerOk:$("#kilerOk"),
  kurSerit:$("#kurSerit"), kurBtn:$("#kurBtn"), kurKapa:$("#kurKapa"), kurMetin:$("#kurMetin")
};

/* Kilerdeki + "evde var sayılan" malzemelerin tekilleştirilmiş anahtar kümesi. */
function etkinKume(){
  const s = new Set(D.kiler.map(canon));
  if (D.temel)   for (const m of TEMEL)   s.add(canon(m));
  if (D.baharat) for (const m of BAHARAT) s.add(canon(m));
  return s;
}

function eslestir(){
  const kume = etkinKume();
  return TARIFLER.map(t => {
    const eksik = t.mlz.filter(([ad]) => !kume.has(canon(ad))).map(([ad]) => ad);
    const varOlan = t.mlz.length - eksik.length;
    return {
      t,
      eksik,
      varOlan,
      oran: t.mlz.length ? varOlan / t.mlz.length : 0,
      durum: eksik.length === 0 ? "ok" : (eksik.length <= 2 ? "near" : "far")
    };
  });
}

const SIRA = {ok:0, near:1, far:2};
function sirala(a, b){
  return SIRA[a.durum] - SIRA[b.durum]
      || a.eksik.length - b.eksik.length
      || b.oran - a.oran
      || a.t.zor - b.t.zor
      || a.t.ad.localeCompare(b.t.ad,"tr");
}

/* ---------------- kiler arayüzü ---------------- */
function kilerdeVar(ad){
  const c = canon(ad);
  return D.kiler.some(x => canon(x) === c);
}
function ekle(ad){
  ad = String(ad).replace(/\s+/g," ").trim();
  if (!ad || kilerdeVar(ad)) return false;
  const bilinen = KATALOG.find(k => canon(k.ad) === canon(ad));
  D.kiler.push(bilinen ? bilinen.ad : ad.toLocaleLowerCase("tr"));
  yaz("kiler", D.kiler);
  return true;
}
function cikar(ad){
  const c = canon(ad);
  D.kiler = D.kiler.filter(x => canon(x) !== c);
  yaz("kiler", D.kiler);
}

function cizTepsi(){
  const sirali = D.kiler.slice().sort((a,b) => a.localeCompare(b,"tr"));
  el.sayi.textContent = D.kiler.length
    ? "Kilerinde " + D.kiler.length + " malzeme var"
    : "Kilerin boş";
  el.kilerOrnek.textContent = D.kiler.length
    ? sirali.slice(0, 6).join(", ") + (D.kiler.length > 6 ? " ve " + (D.kiler.length - 6) + " tane daha" : "")
    : "Ne pişirebileceğini görmek için birkaç malzeme ekle";
  el.tepsi.innerHTML = D.kiler
    .slice()
    .sort((a,b) => a.localeCompare(b,"tr"))
    .map(ad => '<span class="chip">' + esc(ad) +
      '<button type="button" data-cik="' + esc(ad) + '" aria-label="' +
      esc(ad) + ' malzemesini çıkar">&times;</button></span>').join("");
}

function cizHizli(){
  const parcalar = [];
  for (const kat of HIZLI_KATLAR){
    const en = KATALOG.filter(k => k.kat === kat)
                      .sort((a,b) => b.n - a.n || a.ad.localeCompare(b.ad,"tr"))
                      .slice(0, 11);
    if (!en.length) continue;
    parcalar.push('<div class="pickrow"><span class="lbl">' + esc(kat) + '</span>' +
      en.map(k => '<button type="button" class="pick" data-ekle="' + esc(k.ad) + '"' +
        (kilerdeVar(k.ad) ? ' data-on="1"' : '') + '>' + esc(k.ad) + '</button>').join("") +
      '</div>');
  }
  el.hizli.innerHTML = parcalar.join("");
}

/* ---------------- öneri kutusu ---------------- */
let secili = -1, oneriler = [];

function cizOneri(){
  const q = fold(el.ara.value);
  if (!q){ kapatOneri(); return; }
  oneriler = KATALOG
    .filter(k => !kilerdeVar(k.ad))
    .map(k => ({k, p: fold(k.ad).indexOf(q)}))
    .filter(o => o.p !== -1)
    .sort((a,b) => a.p - b.p || b.k.n - a.k.n || a.k.ad.localeCompare(b.k.ad,"tr"))
    .slice(0, 8)
    .map(o => o.k);

  if (!oneriler.length){ kapatOneri(); return; }
  secili = 0;
  el.oneri.innerHTML = oneriler.map((k, idx) =>
    '<button type="button" role="option" data-idx="' + idx + '"' +
    (idx === secili ? ' aria-selected="true"' : ' aria-selected="false"') + '>' +
    '<span>' + esc(k.ad) + '</span><span class="kat">' + esc(k.kat) + '</span></button>').join("");
  el.oneri.hidden = false;
  el.ara.setAttribute("aria-expanded", "true");
}
function kapatOneri(){
  el.oneri.hidden = true;
  el.oneri.innerHTML = "";
  el.ara.setAttribute("aria-expanded", "false");
  oneriler = []; secili = -1;
}
function vurgula(yeni){
  if (!oneriler.length) return;
  secili = (yeni + oneriler.length) % oneriler.length;
  [...el.oneri.children].forEach((b, i) =>
    b.setAttribute("aria-selected", i === secili ? "true" : "false"));
}

/* ---------------- mod düğmeleri ---------------- */
function cizModlar(sonuclar){
  const yapilabilir = z => sonuclar.filter(s =>
    s.durum === "ok" && (z === "hepsi" || s.t.zor === z)).length;

  const tanim = [
    {k:"hepsi", ad:"Hepsi", lv:0},
    {k:1, ad:"Kolay", lv:1},
    {k:2, ad:"Orta", lv:2},
    {k:3, ad:"Zor", lv:3}
  ];
  el.modlar.innerHTML = tanim.map(m =>
    '<button type="button" class="mode" data-mod="' + m.k + '" aria-pressed="' +
    (String(D.mod) === String(m.k)) + '">' +
    (m.lv ? '<span class="meter" data-lv="' + m.lv + '" aria-hidden="true"><i></i><i></i><i></i></span>' : '') +
    '<span class="nm">' + m.ad + '</span>' +
    '<span class="ct">' + yapilabilir(m.k) + ' hazır</span></button>').join("");
}

/* ---------------- sonuç listesi ---------------- */
function kartHTML(s){
  const t = s.t;
  const rozet = s.durum === "ok"
    ? '<span class="pill ok">Malzemen tam</span>'
    : '<span class="pill ' + s.durum + '">' + s.eksik.length + ' eksik</span>';
  const sinif = s.durum === "ok" ? "hazir" : (s.durum === "near" ? "yakin" : "uzak");
  const eksikSatir = s.eksik.length
    ? '<span class="eksik">Eksik: <b>' + s.eksik.map(esc).join("</b>, <b>") + '</b></span>'
    : '';
  return '<button type="button" class="card ' + sinif + '" data-tarif="' + esc(t.i) + '">' +
    '<span class="sol">' +
      '<span class="satir">' +
        '<span class="meter" data-lv="' + t.zor + '" aria-hidden="true"><i></i><i></i><i></i></span>' +
        '<span class="ad">' + esc(t.ad) + '</span>' +
        '<span class="pill tag">' + esc(t.kat) + '</span>' +
      '</span>' +
      '<span class="meta"><span>' + ZOR_AD[t.zor] + '</span><span>' + t.dk +
      ' dakika</span><span>' + t.kisi + ' kişilik</span></span>' + eksikSatir +
    '</span>' +
    '<span class="sag">' + rozet + '</span></button>';
}

/* ---------------- günün önerisi ---------------- */
let heroSecim = null;

/* Önce eksiksiz yapılabilenler; hiç yoksa az eksikle yapılabilenler. */
function heroHavuzu(sonuclar){
  let h = sonuclar;
  if (D.mod !== "hepsi") h = h.filter(s => s.t.zor === Number(D.mod));
  const tam = h.filter(s => s.durum === "ok");
  if (tam.length) return tam;
  return h.filter(s => s.durum === "near");
}

const ROZET_SVG =
  '<svg class="desen" viewBox="0 0 200 200" aria-hidden="true">' +
    '<circle cx="100" cy="100" r="92" fill="none" stroke="#fff" stroke-width="3"></circle>' +
    '<circle cx="100" cy="100" r="74" fill="none" stroke="#fff" stroke-width="2"></circle>' +
    '<g fill="#fff">' +
      '<ellipse cx="100" cy="100" rx="19" ry="58" transform="rotate(0 100 100)"></ellipse>' +
      '<ellipse cx="100" cy="100" rx="19" ry="58" transform="rotate(60 100 100)"></ellipse>' +
      '<ellipse cx="100" cy="100" rx="19" ry="58" transform="rotate(120 100 100)"></ellipse>' +
    '</g>' +
    '<circle cx="100" cy="100" r="21" fill="var(--kobalt-derin)"></circle>' +
  '</svg>';

function cizHero(sonuclar){
  const havuz = heroHavuzu(sonuclar);

  if (!havuz.length){
    el.hero.className = "hero bos";
    el.hero.innerHTML =
      '<div class="hero-in">' +
        '<span class="eyebrow">Bugünün önerisi</span>' +
        '<h2>Buradan bir şey öneremiyorum</h2>' +
        '<p class="hero-durum">' + (D.kiler.length
          ? "Bu zorluk seviyesinde en fazla iki malzemeyle yapabileceğin bir tarif çıkmadı. Başka bir moda geç ya da kilerine birkaç malzeme ekle."
          : "Önce kilerine elindeki malzemeleri ekle, sonra sana ne pişirebileceğini söyleyeyim.") +
        '</p>' +
      '</div>';
    return;
  }

  let s = havuz.find(x => x.t.i === heroSecim);
  if (!s){
    s = havuz[Math.floor(Math.random() * havuz.length)];
    heroSecim = s.t.i;
  }

  const durum = s.eksik.length === 0
    ? "Bütün malzemesi evde, hemen başlayabilirsin."
    : (s.eksik.length === 1
        ? "Sadece <b>" + esc(s.eksik[0]) + "</b> eksik."
        : "<b>" + s.eksik.map(esc).join("</b> ve <b>") + "</b> eksik.");

  el.hero.className = "hero";
  el.hero.innerHTML =
    ROZET_SVG +
    '<div class="hero-in">' +
      '<span class="eyebrow">Bugünün önerisi</span>' +
      '<h2>' + esc(s.t.ad) + '</h2>' +
      '<div class="hero-meta">' +
        '<span class="meter" data-lv="' + s.t.zor + '" aria-hidden="true"><i></i><i></i><i></i></span>' +
        '<span>' + ZOR_AD[s.t.zor] + '</span><span>' + s.t.dk + ' dakika</span>' +
        '<span>' + s.t.kisi + ' kişilik</span><span>' + esc(s.t.kat) + '</span>' +
      '</div>' +
      '<p class="hero-durum">' + durum + '</p>' +
      '<div class="hero-btn">' +
        '<button type="button" class="birincil" data-tarif="' + esc(s.t.i) + '">Tarifi aç</button>' +
        (havuz.length > 1
          ? '<button type="button" class="ikincil" id="baskaOner">Başka öner</button>'
          : '') +
      '</div>' +
    '</div>';
}

function ciz(){
  const sonuclar = eslestir();
  cizModlar(sonuclar);
  cizHero(sonuclar);

  let gosterilecek = sonuclar;
  if (D.mod !== "hepsi") gosterilecek = gosterilecek.filter(s => s.t.zor === Number(D.mod));
  if (D.tam) gosterilecek = gosterilecek.filter(s => s.durum === "ok");
  gosterilecek.sort(sirala);

  const hazir = gosterilecek.filter(s => s.durum === "ok");
  const yakin = gosterilecek.filter(s => s.durum === "near");
  const uzak  = gosterilecek.filter(s => s.durum === "far").slice(0, 8);

  el.ozet.innerHTML = D.kiler.length === 0
    ? 'Kilerin boş. Yukarıdan birkaç malzeme ekle, alt tarafta ne pişirebileceğini göreyim.'
    : '<b>' + hazir.length + '</b> tarifi şu an eksiksiz yapabilirsin, <b>' + yakin.length +
      '</b> tarif için en fazla iki malzeme eksik.';

  if (!hazir.length && !yakin.length && !uzak.length){
    el.liste.innerHTML = '<div class="empty"><h3>Bu filtreyle sonuç yok</h3>' +
      '<p>' + (D.tam
        ? 'Eksiksiz yapabileceğin bir tarif çıkmadı. Üstteki anahtarı kapatıp az eksikli tarifleri de görebilirsin.'
        : 'Birkaç malzeme daha ekle ya da başka bir zorluk moduna geç.') + '</p></div>';
    return;
  }

  const bolum = (baslik, dizi) => dizi.length
    ? '<div class="group-lbl"><span class="eyebrow">' + baslik + ' · ' + dizi.length +
      '</span><span class="rule"></span></div>' + dizi.map(kartHTML).join("")
    : '';

  el.liste.innerHTML =
    bolum("Bugün pişebilir", hazir) +
    bolum("Bir iki malzeme eksik", yakin) +
    bolum("Alışverişe çıkarsan", uzak);
}

/* ---------------- tarif kağıdı ---------------- */
let sonOdak = null;

function ac(id){
  const t = TARIFLER.find(x => x.i === id);
  if (!t) return;
  const kume = etkinKume();
  const satir = ([ad, olcu], ops) => {
    const v = kume.has(canon(ad));
    const sinif = ops ? "ops" : (v ? "var" : "yok");
    const im = ops ? "+" : (v ? "✓" : "✕");
    return '<li class="' + sinif + '">' +
             '<span class="tick">' + im + '</span>' +
             '<span class="mad">' + esc(ad) +
               (ops ? ' <span class="ops-not">(isteğe bağlı)</span>' : '') +
             '</span>' +
             '<span class="molcu">' + esc(olcu) + '</span>' +
           '</li>';
  };

  el.kagit.innerHTML =
    '<div class="sheet-hd">' +
      '<span class="tut" aria-hidden="true"></span>' +
      '<button type="button" class="close" id="kapat" aria-label="Kapat">&times;</button>' +
      '<h2 id="tarifAd">' + esc(t.ad) + '</h2>' +
      '<div class="row">' +
        '<span class="meter" data-lv="' + t.zor + '" aria-hidden="true"><i></i><i></i><i></i></span>' +
        '<span class="pill tag">' + ZOR_AD[t.zor] + '</span>' +
        '<span class="pill tag">' + esc(t.kat) + '</span>' +
        '<span class="sheet-meta"><span>' + t.dk + ' dakika</span><span>' + t.kisi + ' kişilik</span></span>' +
      '</div>' +
    '</div>' +
    '<div class="sheet-bd">' +
      '<section><span class="eyebrow">Malzemeler · ' + t.kisi + ' kişilik</span><ul class="mlist">' +
        t.mlz.map(m => satir(m, false)).join("") +
        (t.eks || []).map(m => satir(m, true)).join("") +
      '</ul></section>' +
      '<section><span class="eyebrow">Yapılışı</span><ol class="steps">' +
        t.adim.map(a => '<li>' + esc(a) + '</li>').join("") +
      '</ol></section>' +
      (t.not ? '<div class="tip"><span class="eyebrow">Püf noktası</span>' + esc(t.not) + '</div>' : '') +
    '</div>';

  sonOdak = document.activeElement;
  el.perde.hidden = false;
  document.body.style.overflow = "hidden";
  el.kagit.querySelector("#kapat").focus();

  /* Telefonun geri tuşu uygulamadan çıkmak yerine tarifi kapatsın. */
  try{ history.pushState({tarif:1}, ""); }catch(e){}
  uyanikTut();
}

/* Tarif açıkken ekran sönmesin — mutfakta elin doluyken işe yarıyor. */
let uyanik = null;
async function uyanikTut(){
  try{
    if ("wakeLock" in navigator && !uyanik)
      uyanik = await navigator.wakeLock.request("screen");
  }catch(e){}
}
function uyanikBirak(){
  try{ if (uyanik) uyanik.release(); }catch(e){}
  uyanik = null;
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !el.perde.hidden) uyanikTut();
});

function kapat(geriDen){
  el.perde.hidden = true;
  el.kagit.innerHTML = "";
  document.body.style.overflow = "";
  uyanikBirak();
  if (sonOdak && sonOdak.isConnected) sonOdak.focus();
  if (!geriDen && history.state && history.state.tarif){
    try{ history.back(); }catch(e){}
  }
}
window.addEventListener("popstate", () => { if (!el.perde.hidden) kapat(true); });

/* ---------------- olaylar ---------------- */
el.ara.addEventListener("input", cizOneri);
el.ara.addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ e.preventDefault(); vurgula(secili + 1); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); vurgula(secili - 1); }
  else if (e.key === "Escape"){ kapatOneri(); }
  else if (e.key === "Enter"){
    e.preventDefault();
    const ad = (secili >= 0 && oneriler[secili]) ? oneriler[secili].ad : el.ara.value;
    if (ekle(ad)){ el.ara.value = ""; kapatOneri(); cizTepsi(); cizHizli(); ciz(); }
  }
});
el.oneri.addEventListener("mousedown", e => {
  const b = e.target.closest("button[data-idx]");
  if (!b) return;
  e.preventDefault();
  if (ekle(oneriler[Number(b.dataset.idx)].ad)){
    el.ara.value = ""; kapatOneri(); cizTepsi(); cizHizli(); ciz();
  }
});
document.addEventListener("click", e => {
  if (!e.target.closest(".searchbox")) kapatOneri();
});

el.tepsi.addEventListener("click", e => {
  const b = e.target.closest("button[data-cik]");
  if (!b) return;
  cikar(b.dataset.cik); cizTepsi(); cizHizli(); ciz();
});
el.hizli.addEventListener("click", e => {
  const b = e.target.closest("button[data-ekle]");
  if (!b) return;
  const ad = b.dataset.ekle;
  if (kilerdeVar(ad)) cikar(ad); else ekle(ad);
  cizTepsi(); cizHizli(); ciz();
});
el.temizle.addEventListener("click", () => {
  D.kiler = []; yaz("kiler", D.kiler);
  cizTepsi(); cizHizli(); ciz();
});
el.modlar.addEventListener("click", e => {
  const b = e.target.closest("button[data-mod]");
  if (!b) return;
  D.mod = b.dataset.mod === "hepsi" ? "hepsi" : Number(b.dataset.mod);
  yaz("mod", D.mod); ciz();
});
el.liste.addEventListener("click", e => {
  const b = e.target.closest("button[data-tarif]");
  if (b) ac(b.dataset.tarif);
});

el.hero.addEventListener("click", e => {
  const b = e.target.closest("button[data-tarif]");
  if (b){ ac(b.dataset.tarif); return; }
  if (e.target.closest("#baskaOner")){
    const havuz = heroHavuzu(eslestir());
    const digerleri = havuz.filter(s => s.t.i !== heroSecim);
    if (digerleri.length) heroSecim = digerleri[Math.floor(Math.random() * digerleri.length)].t.i;
    cizHero(eslestir());
  }
});

/* Kiler varsayılan olarak katlı durur; asıl cevap olan tarifler öne çıksın. */
function kilerCiz(){
  el.kiler.dataset.acik = D.acik ? "1" : "0";
  el.kilerIc.hidden = !D.acik;
  el.kilerAc.setAttribute("aria-expanded", String(D.acik));
  el.kilerOk.textContent = D.acik ? "Kapat" : "Düzenle";
}
el.kilerAc.addEventListener("click", () => {
  D.acik = !D.acik;
  yaz("acik", D.acik);
  kilerCiz();
});

el.swTemel.addEventListener("change", e => { D.temel = e.target.checked; yaz("temel", D.temel); ciz(); });
el.swBaharat.addEventListener("change", e => { D.baharat = e.target.checked; yaz("baharat", D.baharat); ciz(); });
el.swTam.addEventListener("change", e => { D.tam = e.target.checked; yaz("tam", D.tam); ciz(); });

el.perde.addEventListener("click", e => {
  if (e.target === el.perde || e.target.closest("#kapat")) kapat();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !el.perde.hidden) kapat();
});

el.temaBtn.addEventListener("click", () => {
  const suan = document.documentElement.getAttribute("data-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const yeni = suan === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", yeni);
  yaz("tema", yeni);
});

/* ---------------- ana ekrana kurulum ---------------- */
const cerceveIcinde = (() => { try{ return window.top !== window.self; }catch(e){ return true; } })();
const ekranaEkli = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const iOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const kurulabilir = () => !ekranaEkli && !cerceveIcinde && !oku("kurGizle", false);

let kurOlayi = null;

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  kurOlayi = e;
  if (!kurulabilir()) return;
  el.kurMetin.textContent = "Tarayıcı açmadan, ev ekranından tek dokunuşla aç. Çevrimdışı da çalışır.";
  el.kurBtn.hidden = false;
  el.kurSerit.hidden = false;
});

el.kurBtn.addEventListener("click", async () => {
  if (!kurOlayi) return;
  kurOlayi.prompt();
  try{ await kurOlayi.userChoice; }catch(e){}
  kurOlayi = null;
  el.kurSerit.hidden = true;
});
el.kurKapa.addEventListener("click", () => {
  el.kurSerit.hidden = true;
  yaz("kurGizle", true);
});
window.addEventListener("appinstalled", () => {
  el.kurSerit.hidden = true;
  yaz("kurGizle", true);
});

/* Çevrimdışı çalışma. Yalnızca gerçek bir adresten açıldığında devreye girer. */
if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !cerceveIcinde){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ---------------- açılış ---------------- */
(function baslat(){
  const tema = oku("tema", null);
  if (tema === "dark" || tema === "light") document.documentElement.setAttribute("data-theme", tema);

  /* Kiler boşsa açık başlasın; yapacak bir şey yoksa kullanıcı ne yapacağını görsün. */
  if (!D.kiler.length) D.acik = true;
  kilerCiz();

  el.swTemel.checked = D.temel;
  el.swBaharat.checked = D.baharat;
  el.swTam.checked = D.tam;

  const say = {1:0, 2:0, 3:0};
  for (const t of TARIFLER) say[t.zor]++;
  el.dbSayi.textContent = TARIFLER.length + " tarif · " + say[1] + " kolay, " +
                          say[2] + " orta, " + say[3] + " zor";

  /* iPhone'da kurulum düğmesi yok; Safari'nin Paylaş menüsünü tarif et. */
  if (iOS && kurulabilir()){
    el.kurMetin.textContent = "Safari'nin alt çubuğundaki Paylaş düğmesine bas, listeden \u201cAna Ekrana Ekle\u201d seç.";
    el.kurBtn.hidden = true;
    el.kurSerit.hidden = false;
  }

  cizTepsi(); cizHizli(); ciz();
})();
</script>
</body>
</html>
